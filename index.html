<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Top Reposteras</title>
</head>
<body>
    <header>
        <nav id="navBar" class="navbar navbar-expand-lg navbar-light ">
            <div class="container-fluid">
                <h3 class="marca" href="./index.html">Top Reposteras</h3>
                <button id="btnBurger" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#colapsable" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>             
        <!-- Contenido colapsable -->
            <div class="collapse navbar-collapse" id="colapsable">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Menu
                  </a>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="./detalleProducto.html">Producto</a></li>
                    <li><a class="dropdown-item" href="./catalogo.html">Catalogo</a></li>
                    </ul>
                </li>  
               </ul>
        <!-- btn login register and carrito-->      
                <div class="ms-auto">
                    <button  class="btn btn-outline-primary" type="button" data-bs-toggle ="modal" data-bs-target="#loginModal">Login</button>
                    <span id="usuarioLogueado"></span> 
                    <button id="btnCarrito" class="btn btn-warning position-relative" type="button" data-bs-toggle ="offcanvas" data-bs-target="#containerCarrito" aria-controls="offcanvasRight">
                        <img src="./assets/img/iconcar.png"  alt="carrito" class="img-fluid" style="width: 25px; height: 25px;">
                    </button>
                    
                    <div id="contenedorCarrito" class="d-none"></div>
                </div>
            </div>
            </div>
        </nav>
        <div id="banner" class="text-center my-">
          <img id="imgbanner" src="./assets/img/banner.webp" alt="banner" class="img-fluid">
        </div> 
    </header>
    <section class="promotion">
        <h2>Productos Destacados</h2>
        <p>Explora nuestos productos con un 15% de descuento</p>  
    </section>
    <main>
      <div class="cardContainer" id="cardMuestra" >
       <!-- Contiene las tarjetas de productos--> 
      </div>
      <!----------- Carrito--------->
      <div class="offcanvas offcanvas-end " tabindex="-1" id="containerCarrito" aria-labelledby="offcanvasRightLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasLabel">Tienes  Productos</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body" id="offCanvasCarrito">
          <table id="carritoTable" class="table table-hover">
            <thead>
              <tr>
                <th scope="col">Producto</th>
                <th scope="col">Precio</th>
                <th scope="col">Cantidad</th>
              </tr>
            </thead>
          <tbody id="carritoBody">
            <!-- filas dinamicas-->
          </tbody> 
        </table>
        <br><br>
        <!-- resumen carrito-->
        <section class="mt-3" id="totalCarrito">
          <p id="subtotal"> </p>
          <p id="descuento"></p>
          <p id="total"><strong></strong></p>
          <button class="btn btn-primary w-100">Comprar</button>
        </section> 
            </div>
          </div>
      </div>  
    </main>
    <footer id="foo">
       <p> Siguenos</p>
        <div class="social-icon">       
            <img class="iconSo" src="./assets/img/instagram.png" alt="instaLogo">
            <img class="iconSo" src="./assets/img/wsp4.png" alt="wspLogo">
            <img class="iconSo" src="./assets/img/faceb.png" alt="faceLogo">
            <img class="iconSo" src="./assets/img/you.png" alt="youLogo">
        </div>
        <p>&copy; Top Repostero todos los derechos reservados 2025</p>
    </footer>
<!--Modal Login -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="ModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="modalTitle">Iniciar Sesión </h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="formLogin">
              <div class="mb-3">
                <label for="user" class="col-form-label">Usuario:</label>
                <input type="text" class="form-control" id="user">
              </div>
              <div class="mb-3">
                <label for="password" class="col-form-label">Contraseña:</label>
                <input type="password" class="form-control" id="password" autocomplete="current-password">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#modalRegistrarse">Crear Cuenta</button>
            <button type="button" class="btn btn-primary" id="btnIniciarSesion" >Iniciar Sesión</button>
          </div>
        </div>
      </div>
    </div>
<!-- Modal Registrarse-->
    <div class="modal fade" id="modalRegistrarse" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fs-5" id="modalCreateCta">Crear cuenta</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
        <div class="modal-body">
          <form id="formCuenta">
            <div class="mb-3">
              <label for="nameUser" class="form-label">Nombre Usuario:</label>
              <input type="text" class="form-control" id="nameUser" required>
            </div>
            <div class="mb-3">
              <label for="createPass" class="form-label">Contarseña:</label>
              <input type="password" class="form-control" id="createPass" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo Electronico:</label>
              <input type="text" class="form-control" id="email" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary" id="createAcount">Registrarse</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#loginModal">
                <i class="bi bi-arrow-left"></i>Volver</button>         
            </div>
          </form>
         </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script  type="module" src="./assets/js/catalogo.js"></script>
</body>
</html>
